experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\variance\sgmap-net_s-ms_20260813_224852\best_loss_epoch8.pth
  end_training: 23:00 08/13/2026
  output_dir: E:\GitHub\earthscape\experiments\sgmap-net\classification\variance\sgmap-net_s-ms_20260813_224852
