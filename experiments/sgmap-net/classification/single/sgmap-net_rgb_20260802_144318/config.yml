      - 81.96619
      - 81.83767
      - 74.148636
      sd:
      - 36.90098
      - 31.398926
      - 27.555475
  root: data
dataloader:
  base:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 5
  warmup_epochs: 5
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.32898324728012085
  - 0.3408045768737793
  - 0.15811719000339508
  - 0.3664571940898895
  - 0.5080673694610596
  - 0.44594284892082214
  - 0.11336129903793335
experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\single\sgmap-net_rgb_20260802_144318\best_loss_epoch3.pth
  end_training: 14:50 08/02/2026
  output_dir: E:\GitHub\earthscape\experiments\sgmap-net\classification\single\sgmap-net_rgb_20260802_144318
  root: experiments/sgmap-net/classification/single
