data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    sds-5:
      channels:
      - sds_5x5.tif
      mean:
      - 1.2617278
      sd:
      - 1.4703324
  root: data
dataloader:
  base:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 5
  warmup_epochs: 5
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.4584476053714752
  - 0.416283518075943
  - 0.08746622502803802
  - 0.18353122472763062
  - 0.25941431522369385
  - 0.4853594899177551
  - 0.41478365659713745
experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\single\sgmap-net_sds-5_20260810_181613\best_loss_epoch1.pth
  end_training: 18:24 08/10/2026
  output_dir: E:\GitHub\earthscape\experiments\sgmap-net\classification\single\sgmap-net_sds-5_20260810_181613
  root: experiments/sgmap-net/classification/single
  seed: 111
  start_training: 18:16 08/10/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  classification:
    name: bcefocal
    params:
      alpha: null
      gamma: 0.5
      pos_weight: null
      reduction: mean
  segmentation:
    name: crossentropyloss
    params:
      reduction: mean
      weight: null
model:
  encoder_name: vit_b_16
  image_size: 256
  in_channels: 1
  model_name: sgmap-net
  output_size: 7
  sgmapnet_params:
    embedding_dim: 512
    embedding_fusion: none
    encoder_sharing: shared
    image_size: 224
    input_adapter: adapt
    num_heads: 8
    p_attn: 0.0
    p_resid: 0.0
    pretrained: true
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: false
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
