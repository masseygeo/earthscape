    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 5
  warmup_epochs: 5
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.45416325330734253
  - 0.4255709648132324
  - 0.303708553314209
  - 0.1680871993303299
  - 0.4198567271232605
  - 0.4534243941307068
  - 0.49841976165771484
experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\variance_splits\sgmap-net_s-5_20260816_182904\best_loss_epoch24.pth
  end_training: 18:48 08/16/2026
