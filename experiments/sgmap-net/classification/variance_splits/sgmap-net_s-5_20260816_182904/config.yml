  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    s-5:
      channels:
      - s.tif
      mean:
      - 5.5359945
      sd:
      - 5.1698084
  root: data
dataloader:
  base:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
