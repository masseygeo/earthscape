  - sonora/patches
  input:
    dem:
      channels:
      - dem.tif
      mean:
      - 578.2135
      sd:
      - 73.66486
  root: data
dataloader:
  base:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
