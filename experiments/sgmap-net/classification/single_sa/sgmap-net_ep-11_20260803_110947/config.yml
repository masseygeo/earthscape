data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    ep-11:
      channels:
      - ep_11x11.tif
      mean:
      - 48.969097
      sd:
      - 11.441515
  root: data
dataloader:
  base:
    batch_size: 16
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 5
  warmup_epochs: 5
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.2941126823425293
  - 0.3371460735797882
  - 0.12847931683063507
  - 0.2775002121925354
  - 0.4265401363372803
  - 0.38573920726776123
  - 0.43943023681640625
experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\single_sa\sgmap-net_ep-11_20260803_110947\best_loss_epoch3.pth
  end_training: 11:17 08/03/2026
  output_dir: E:\GitHub\earthscape\experiments\sgmap-net\classification\single_sa\sgmap-net_ep-11_20260803_110947
  root: experiments/sgmap-net/classification/single_sa
  seed: 111
  start_training: 11:09 08/03/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  classification:
    name: bcefocal
    params:
      alpha: null
      gamma: 0.5
      pos_weight: null
      reduction: mean
  segmentation:
    name: crossentropyloss
    params:
      reduction: mean
      weight: null
model:
  encoder_name: resnext50_32x4d
  image_size: 256
  in_channels: 1
  model_name: sgmap-net
  output_size: 7
  sgmapnet_params:
    embedding_dim: 512
    embedding_fusion: self_attention
    encoder_sharing: shared
    image_size: null
    input_adapter: adapt
    num_heads: 8
    p_attn: 0.0
    p_resid: 0.0
    pretrained: true
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: false
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
