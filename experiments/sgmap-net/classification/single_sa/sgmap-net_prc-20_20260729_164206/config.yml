data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    prc-20:
      channels:
      - prc_20.tif
      mean:
      - 0.056374535
      sd:
      - 1.4133822
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 5
  warmup_epochs: 5
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.31042584776878357
  - 0.27188506722450256
  - 0.20436249673366547
  - 0.21549522876739502
  - 0.7490540146827698
  - 0.4670153260231018
  - 0.4290308356285095
experiment:
  best_model: E:\GitHub\earthscape\experiments\sgmap-net\classification\single_sa\sgmap-net_prc-20_20260729_164206\best_loss_epoch6.pth
  end_training: 16:48 07/29/2026
  output_dir: E:\GitHub\earthscape\experiments\sgmap-net\classification\single_sa\sgmap-net_prc-20_20260729_164206
  root: experiments/sgmap-net/classification/single_sa
  seed: 111
  start_training: 16:42 07/29/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  classification:
    name: bcefocal
    params:
      alpha: null
      gamma: 0.5
      pos_weight: null
      reduction: mean
  segmentation:
    name: crossentropyloss
    params:
      reduction: mean
      weight: null
model:
  encoder_name: resnext50_32x4d
  image_size: 256
  in_channels: 1
  model_name: sgmap-net
  output_size: 7
  sgmapnet_params:
    embedding_dim: 512
    embedding_fusion: self_attention
    encoder_sharing: shared
    image_size: null
    input_adapter: adapt
    num_heads: 8
    p_attn: 0.0
    p_resid: 0.0
    pretrained: true
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: false
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
