data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem+rgb:
      channels:
      - dem.tif
      - aerialr.tif
      - aerialg.tif
      - aerialb.tif
      mean:
      - 578.66797
      - 81.96619
      - 81.83767
      - 74.148636
      sd:
      - 74.129265
      - 36.90098
      - 31.398926
      - 27.555475
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
experiment:
  best_model: e:\GitHub\earthscape\experiments\baselines\segmentation\multimodal\segformer-mit-b2_dem+rgb_20260328_113652\best_loss_epoch46.pth
  end_training: 12:07 03/28/2026
  output_dir: e:\GitHub\earthscape\experiments\baselines\segmentation\multimodal\segformer-mit-b2_dem+rgb_20260328_113652
  root: experiments/baselines/segmentation/multimodal
  seed: 111
  start_training: 11:36 03/28/2026
  task: segmentation
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: crossentropyloss
  params:
    reduction: mean
    weight: null
model:
  encoder_name: mit_b2
  image_size: 256
  in_channels: 4
  model_name: segformer
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
