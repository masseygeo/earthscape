data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    plc-ms:
      channels:
      - plc.tif
      - plc_10.tif
      - plc_20.tif
      - plc_50.tif
      - plc_100.tif
      - plc_200.tif
      mean:
      - 0.07032508
      - 0.04538878
      - 0.055494342
      - 0.088411525
      - 0.23687477
      - 0.2785671
      sd:
      - 1.252125
      - 3.6387227
      - 3.5395117
      - 3.1152456
      - 4.617218
      - 4.065466
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
experiment:
  best_model: e:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer-mitb2_plc-ms_20260327_173246\best_loss_epoch34.pth
  end_training: 17:59 03/27/2026
  output_dir: e:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer-mitb2_plc-ms_20260327_173246
  root: experiments/baselines/segmentation/multiscale
  seed: 111
  start_training: 17:32 03/27/2026
  task: segmentation
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: crossentropyloss
  params:
    reduction: mean
    weight: null
model:
  encoder_name: mit_b2
  image_size: 256
  in_channels: 6
  model_name: segformer
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
