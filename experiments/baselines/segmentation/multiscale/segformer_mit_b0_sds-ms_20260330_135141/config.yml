data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    sds-ms:
      channels:
      - sds_5x5.tif
      - sds_11x11.tif
      - sds_21x21.tif
      - sds_51x51.tif
      - sds_101x101.tif
      - sds_201x201.tif
      mean:
      - 1.2617278
      - 1.7932228
      - 2.2564251
      - 2.894819
      - 3.3649724
      - 3.8161497
      sd:
      - 1.4703324
      - 1.8890829
      - 2.1219993
      - 2.294933
      - 2.314537
      - 2.24883
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer_mit_b0_sds-ms_20260330_135141\best_loss_epoch42.pth
  end_training: 14:41 03/30/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer_mit_b0_sds-ms_20260330_135141
  root: experiments/baselines/segmentation/multiscale
  seed: 111
  start_training: 13:51 03/30/2026
  task: segmentation
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: crossentropyloss
  params:
    reduction: mean
    weight: null
model:
  encoder_name: mit_b0
  image_size: 256
  in_channels: 6
  model_name: segformer
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
