data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    s-ms:
      channels:
      - s.tif
      - s_10.tif
      - s_20.tif
      - s_50.tif
      - s_100.tif
      - s_200.tif
      mean:
      - 5.486915
      - 4.8205023
      - 4.4264684
      - 3.5336185
      - 2.687141
      - 1.8690363
      sd:
      - 5.0718284
      - 4.716982
      - 4.337691
      - 3.575751
      - 2.7809925
      - 1.8542851
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
experiment:
  best_model: e:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer-mit-b0_s-ms_20260330_125622\best_loss_epoch33.pth
  end_training: 13:37 03/30/2026
  output_dir: e:\GitHub\earthscape\experiments\baselines\segmentation\multiscale\segformer-mit-b0_s-ms_20260330_125622
  root: experiments/baselines/segmentation/multiscale
  seed: 111
  start_training: 12:56 03/30/2026
  task: segmentation
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: crossentropyloss
  params:
    reduction: mean
    weight: null
model:
  encoder_name: mit_b0
  image_size: 256
  in_channels: 6
  model_name: segformer
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
