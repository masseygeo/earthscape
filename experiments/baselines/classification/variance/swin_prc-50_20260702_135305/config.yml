  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    prc-50:
      channels:
      - prc_50.tif
      mean:
      - -0.016703786
      sd:
      - 0.98491603
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
