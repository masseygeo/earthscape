    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.24816487729549408
  - 0.3123062252998352
  - 0.07993371039628983
  - 0.06014689803123474
  - 0.36366140842437744
  - 0.3671630620956421
  - 0.3900909423828125
experiment:
