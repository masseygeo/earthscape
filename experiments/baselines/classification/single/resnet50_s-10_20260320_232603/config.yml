    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.46213459968566895
  - 0.3304498791694641
  - 0.088624007999897
  - 0.1179208979010582
  - 0.40153440833091736
  - 0.5535995960235596
  - 0.09421198815107346
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\resnet50_s-10_20260320_232603\best_loss_epoch14.pth
  end_training: 23:36 03/20/2026
