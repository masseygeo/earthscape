  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    s-10:
      channels:
      - s_10.tif
      mean:
      - 4.8205023
      sd:
      - 4.716982
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
