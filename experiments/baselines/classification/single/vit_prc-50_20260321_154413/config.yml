data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    prc-50:
      channels:
      - prc_50.tif
      mean:
      - -0.016703786
      sd:
      - 0.98491603
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.1854860931634903
  - 0.36524632573127747
  - 0.07824420928955078
  - 0.08754763007164001
  - 0.19068947434425354
  - 0.35869109630584717
  - 0.46715933084487915
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_prc-50_20260321_154413\best_loss_epoch42.pth
  end_training: 16:23 03/21/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_prc-50_20260321_154413
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 15:44 03/21/2026
  task: classification
labels:
  area_threshold: 0.0
