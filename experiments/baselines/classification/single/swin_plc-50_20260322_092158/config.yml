  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    plc-50:
      channels:
      - plc_50.tif
      mean:
      - 0.088411525
      sd:
      - 3.1152456
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.2767963409423828
  - 0.3718053102493286
  - 0.13438068330287933
  - 0.43738752603530884
  - 0.31403425335884094
  - 0.299733430147171
  - 0.22056269645690918
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_plc-50_20260322_092158\best_loss_epoch57.pth
  end_training: 09:55 03/22/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_plc-50_20260322_092158
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 09:21 03/22/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  encoder_name: null
  image_size: 256
  in_channels: 1
  model_name: swin
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
