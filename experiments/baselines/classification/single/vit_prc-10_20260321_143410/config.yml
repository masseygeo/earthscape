data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    prc-10:
      channels:
      - prc_10.tif
      mean:
      - 0.10695917
      sd:
      - 1.6511495
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.29272985458374023
  - 0.5235493183135986
  - 0.04938053339719772
  - 0.19796767830848694
  - 0.5080074667930603
  - 0.36403414607048035
  - 0.5316019654273987
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_prc-10_20260321_143410\best_loss_epoch15.pth
  end_training: 15:11 03/21/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_prc-10_20260321_143410
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 14:34 03/21/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  encoder_name: null
  image_size: 256
  in_channels: 1
  model_name: vit
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
