data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    ep-11:
      channels:
      - ep_11x11.tif
      mean:
      - 48.969097
      sd:
      - 11.441515
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.5484073162078857
  - 0.43715858459472656
  - 0.0384100079536438
  - 0.15510909259319305
  - 0.3934278190135956
  - 0.4607120454311371
  - 0.42514166235923767
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\resnet18_ep-11_20260320_150308\best_loss_epoch19.pth
  end_training: 15:07 03/20/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\resnet18_ep-11_20260320_150308
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 15:03 03/20/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  encoder_name: null
  image_size: 256
  in_channels: 1
  model_name: resnet18
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
