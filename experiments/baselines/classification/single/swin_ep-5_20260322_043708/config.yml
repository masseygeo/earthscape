data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    ep-5:
      channels:
      - ep_5x5.tif
      mean:
      - 47.13096
      sd:
      - 9.864855
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.526868999004364
  - 0.43812400102615356
  - 0.09911436587572098
  - 0.16377727687358856
  - 0.48898327350616455
  - 0.37078845500946045
  - 0.5623787045478821
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_ep-5_20260322_043708\best_loss_epoch51.pth
  end_training: 05:08 03/22/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_ep-5_20260322_043708
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 04:37 03/22/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  encoder_name: null
  image_size: 256
  in_channels: 1
  model_name: swin
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
