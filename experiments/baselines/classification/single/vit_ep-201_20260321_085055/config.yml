  - sonora/patches
  input:
    ep-201:
      channels:
      - ep_201x201.tif
      mean:
      - 49.99699
      sd:
      - 22.02067
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
