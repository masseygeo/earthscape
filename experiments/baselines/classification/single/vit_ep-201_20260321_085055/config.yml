    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.22008119523525238
  - 0.40829357504844666
  - 0.03664792701601982
  - 0.23163536190986633
  - 0.30197733640670776
  - 0.3163297772407532
  - 0.3995685279369354
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_ep-201_20260321_085055\best_loss_epoch37.pth
  end_training: 09:26 03/21/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_ep-201_20260321_085055
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 08:50 03/21/2026
