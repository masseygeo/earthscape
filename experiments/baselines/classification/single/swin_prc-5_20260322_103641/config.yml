  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    prc-5:
      channels:
      - prc.tif
      mean:
      - 0.036541183
      sd:
      - 0.55064213
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.3772570490837097
  - 0.4855404198169708
  - 0.048683296889066696
  - 0.1488724946975708
  - 0.5371666550636292
  - 0.5014699697494507
  - 0.40908950567245483
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_prc-5_20260322_103641\best_loss_epoch61.pth
  end_training: 11:12 03/22/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\swin_prc-5_20260322_103641
  root: experiments/baselines/classification/single
  seed: 111
  start_training: 10:36 03/22/2026
  task: classification
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  encoder_name: null
  image_size: 256
  in_channels: 1
  model_name: swin
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
