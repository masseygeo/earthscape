  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    plc-200:
      channels:
      - plc_200.tif
      mean:
      - 0.2785671
      sd:
      - 4.065466
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.3391498923301697
  - 0.4134960174560547
  - 0.052978504449129105
  - 0.1331149935722351
  - 0.46700936555862427
  - 0.2623503506183624
  - 0.7718866467475891
experiment:
  best_model: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_plc-200_20260321_124700\best_loss_epoch24.pth
  end_training: 13:13 03/21/2026
  output_dir: E:\GitHub\earthscape\experiments\baselines\classification\single\vit_plc-200_20260321_124700
  root: experiments/baselines/classification/single
