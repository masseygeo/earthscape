data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem:
      channels:
      - dem.tif
      mean:
      - 578.66797
      sd:
      - 74.129265
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 25
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.171988382935524
  - 0.3780270516872406
  - 0.34180018305778503
  - 0.277023583650589
  - 0.33159154653549194
  - 0.4011056125164032
  - 0.38977378606796265
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baseline_settings\vit_dem_20260303_025102\best_loss_epoch43.pth
  end_training: 03:32 03/03/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baseline_settings\vit_dem_20260303_025102
  root: experiments/classification/baseline_settings
  seed: 111
  start_training: 02:51 03/03/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: vit
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0001
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
