data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    slope:
      channels:
      - s.tif
      mean:
      - 5.486915
      sd:
      - 5.0718284
  root: data
dataloader:
  base:
    batch_size: 128
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 25
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.21307474374771118
  - 0.2527162730693817
  - 0.06815274059772491
  - 0.21215103566646576
  - 0.32549482583999634
  - 0.5012184381484985
  - 0.5329402089118958
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baseline_settings\resnet18_slope_20260302_121553\best_loss_epoch18.pth
  end_training: 12:20 03/02/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baseline_settings\resnet18_slope_20260302_121553
  root: experiments/classification/baseline_settings
  seed: 111
  start_training: 12:15 03/02/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet18
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.001
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
