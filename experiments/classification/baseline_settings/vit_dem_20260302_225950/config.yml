  - 0.041919220238924026
  - 0.14852213859558105
  - 0.4865209460258484
  - 0.39574572443962097
  - 0.3905397951602936
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baseline_settings\vit_dem_20260302_225950\best_loss_epoch35.pth
  end_training: 23:34 03/02/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baseline_settings\vit_dem_20260302_225950
  root: experiments/classification/baseline_settings
  seed: 111
