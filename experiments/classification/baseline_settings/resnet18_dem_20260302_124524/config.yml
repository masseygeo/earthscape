data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem:
      channels:
      - dem.tif
      mean:
      - 578.66797
      sd:
      - 74.129265
  root: data
dataloader:
  base:
    batch_size: 128
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 25
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.27726852893829346
  - 0.4256834387779236
  - 0.061274453997612
  - 0.18702898919582367
  - 0.8681583404541016
  - 0.3706313669681549
  - 0.6022667288780212
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baseline_settings\resnet18_dem_20260302_124524\best_loss_epoch29.pth
  end_training: 12:50 03/02/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baseline_settings\resnet18_dem_20260302_124524
  root: experiments/classification/baseline_settings
  seed: 111
  start_training: 12:45 03/02/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet18
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
