data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    sds101:
      channels:
      - sds_101x101.tif
      mean:
      - 3.3649724
      sd:
      - 2.314537
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.28627336025238037
  - 0.36675581336021423
  - 0.041376423090696335
  - 0.053700778633356094
  - 0.27282223105430603
  - 0.3039094805717468
  - 0.7255253791809082
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\swin_sds101_20260308_011525\best_loss_epoch39.pth
  end_training: 01:40 03/08/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\swin_sds101_20260308_011525
  root: experiments/classification/baselines/single
  seed: 111
  start_training: 01:15 03/08/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: swin
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
