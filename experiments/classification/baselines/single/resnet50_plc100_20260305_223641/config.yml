labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet50
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
