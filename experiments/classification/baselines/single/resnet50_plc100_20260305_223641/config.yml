  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    plc100:
      channels:
      - plc_100.tif
      mean:
      - 0.23687477
      sd:
      - 4.617218
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.19212736189365387
  - 0.29240939021110535
  - 0.02347758039832115
  - 0.06889519095420837
  - 0.268398255109787
  - 0.32510361075401306
  - 0.6372265219688416
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet50_plc100_20260305_223641\best_loss_epoch25.pth
  end_training: 22:46 03/05/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet50_plc100_20260305_223641
