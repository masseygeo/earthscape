data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    s50:
      channels:
      - s_50.tif
      mean:
      - 3.5336185
      sd:
      - 3.575751
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.27021774649620056
  - 0.3709706664085388
  - 0.07706861943006516
  - 0.07926192879676819
  - 0.3563692569732666
  - 0.23419184982776642
  - 0.48494377732276917
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet50_s50_20260306_004725\best_loss_epoch32.pth
  end_training: 00:59 03/06/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet50_s50_20260306_004725
  root: experiments/classification/baselines/single
  seed: 111
  start_training: 00:47 03/06/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet50
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
