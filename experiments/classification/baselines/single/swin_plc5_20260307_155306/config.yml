data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    plc5:
      channels:
      - plc.tif
      mean:
      - 0.07032508
      sd:
      - 1.252125
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.2285694032907486
  - 0.25318026542663574
  - 0.04179733619093895
  - 0.10502012819051743
  - 0.47641247510910034
  - 0.37140190601348877
  - 0.5068547129631042
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\swin_plc5_20260307_155306\best_loss_epoch72.pth
  end_training: 16:34 03/07/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\swin_plc5_20260307_155306
  root: experiments/classification/baselines/single
  seed: 111
  start_training: 15:53 03/07/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: swin
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
