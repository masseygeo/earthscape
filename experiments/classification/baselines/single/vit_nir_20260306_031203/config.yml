data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    nir:
      channels:
      - aerialnir.tif
      mean:
      - 104.60315
      sd:
      - 34.788418
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.27934932708740234
  - 0.47398707270622253
  - 0.0452248752117157
  - 0.18523108959197998
  - 0.40072110295295715
  - 0.30111852288246155
  - 0.5959892868995667
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\vit_nir_20260306_031203\best_loss_epoch53.pth
  end_training: 03:59 03/06/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\vit_nir_20260306_031203
  root: experiments/classification/baselines/single
  seed: 111
  start_training: 03:12 03/06/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: vit
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
