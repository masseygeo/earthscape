data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    sds11:
      channels:
      - sds_11x11.tif
      mean:
      - 1.7932228
      sd:
      - 1.8890829
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.33403417468070984
  - 0.30793893337249756
  - 0.15096893906593323
  - 0.17143122851848602
  - 0.5058675408363342
  - 0.41111454367637634
  - 0.27705857157707214
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet18_sds11_20260303_154317\best_loss_epoch18.pth
  end_training: 15:46 03/03/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\single\resnet18_sds11_20260303_154317
  root: experiments/classification/baselines/single
  seed: 111
  start_training: 15:43 03/03/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet18
  image_size: 256
  in_channels: 1
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
