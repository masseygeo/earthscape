    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.20155945420265198
  - 0.37459105253219604
  - 0.025972479954361916
  - 0.23846377432346344
  - 0.5638805627822876
  - 0.36640027165412903
  - 0.45714884996414185
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\single\vit_dem_20260306_044740\best_loss_epoch46.pth
  end_training: 05:29 03/06/2026
