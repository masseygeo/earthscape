  - sonora/patches
  input:
    dem:
      channels:
      - dem.tif
      mean:
      - 578.66797
      sd:
      - 74.129265
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
