data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem_osm:
      channels:
      - dem.tif
      - osm.tif
      mean:
      - 578.66797
      - null
      sd:
      - 74.129265
      - null
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.3882468044757843
  - 0.4460653066635132
  - 0.0978492796421051
  - 0.08793915808200836
  - 0.6987340450286865
  - 0.5164995789527893
  - 0.3985409438610077
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\swin_dem_osm_20260305_155734\best_loss_epoch40.pth
  end_training: 16:24 03/05/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\swin_dem_osm_20260305_155734
  root: experiments/classification/baselines/multimodal
