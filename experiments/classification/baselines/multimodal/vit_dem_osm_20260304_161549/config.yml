  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem_osm:
      channels:
      - dem.tif
      - osm.tif
      mean:
      - 578.66797
      - null
      sd:
      - 74.129265
      - null
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.2510613799095154
  - 0.2898266613483429
  - 0.028870265930891037
  - 0.19242675602436066
  - 0.5002284049987793
  - 0.3611709475517273
  - 0.34805354475975037
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\vit_dem_osm_20260304_161549\best_loss_epoch35.pth
  end_training: 16:51 03/04/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\vit_dem_osm_20260304_161549
  root: experiments/classification/baselines/multimodal
