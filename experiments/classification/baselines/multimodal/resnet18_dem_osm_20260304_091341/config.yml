data:
  dirs:
  - warren/patches
  - howevalley/patches
  - sonora/patches
  input:
    dem_osm:
      channels:
      - dem.tif
      - osm.tif
      mean:
      - 578.66797
      - null
      sd:
      - 74.129265
      - null
  root: data
dataloader:
  base:
    batch_size: 64
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 2
  eval:
    augment: false
    drop_last: false
    shuffle: false
  train:
    augment: true
    drop_last: true
    shuffle: true
early_stop:
  min_delta: 0.0
  patience: 10
  warmup_epochs: 20
eval:
  labels:
  - af1
  - Qal
  - Qaf
  - Qat
  - Qc
  - Qca
  - Qr
  optimize_clf_thresholds: true
  thresholds:
  - 0.3285256028175354
  - 0.4678904712200165
  - 0.2203586995601654
  - 0.43015697598457336
  - 0.5090128183364868
  - 0.45244893431663513
  - 0.20665158331394196
experiment:
  best_model: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\resnet18_dem_osm_20260304_091341\best_loss_epoch34.pth
  end_training: 09:21 03/04/2026
  output_dir: E:\GitHub\earthscape\experiments\classification\baselines\multimodal\resnet18_dem_osm_20260304_091341
  root: experiments/classification/baselines/multimodal
  seed: 111
  start_training: 09:13 03/04/2026
labels:
  area_threshold: 0.0
  glob: '*areas.csv'
  root: data
loss:
  name: bcefocal
  params:
    alpha: null
    gamma: 0
    pos_weight: null
    reduction: mean
model:
  compile: false
  encoder: resnet18
  image_size: 256
  in_channels: 2
  output_size: 7
norm:
  glob: '*train_stats.csv'
  normalize: true
  root: splits/esv1p1_splits
optimizer:
  cd_params:
    T_max: starts at 5 epochs
    eta_min: 1.0e-05
  cosine_decay: true
  name: AdamW
  params:
    betas:
    - 0.9
    - 0.999
    lr: 0.0003
    weight_decay: 0.01
  warmup: true
  warmup_params:
    end_factor: 1.0
    start_factor: 0.001
    total_iters: 5 epochs converted to steps
splits:
  glob:
    cross: '*test_cd.geojson'
    test: '*test_id.geojson'
    train: '*train_id.geojson'
    val: '*val_id.geojson'
  root: splits/esv1p1_splits
training:
  device: cuda
  num_epochs: 150
