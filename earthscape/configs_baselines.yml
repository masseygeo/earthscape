experiment:
  output_root: ../experiments/classification
  description: Test run for training, validation, and inference using F1-optimized ResNet18 (modified for input & output sizes).
  seed: 111

data:
  name: earthscape
  version: 1.1
  patch_dirs: 
    - ../data/warren/patches
    - ../data/howevalley/patches
    - ../data/sonora/patches
  split_files:
    train: train_id.geojson
    val: val_id.geojson
    test: test_id.geojson
    cross_test: test_cd.geojson
    norm_stats: train_stats.csv
  input_features:
    dem:
      channels:
        - dem.tif
    # aerial:
    #   channels:
    #     - aerialr.tif
    #     - aerialg.tif
    #     - aerialb.tif

model: 
  encoder: resnet18
  image_size: 256
  output_size: 7
  compile: true

training:
  num_epochs: 5
  default_params:
    batch_size: 4
    drop_last: true
    num_workers: 8
    persistent_workers: true
    prefetch_factor: 4
  train_augment: true
  train_shuffle: true
  ttv_augment: false
  ttv_shuffle: false
  normalize: true
  optimize_thresholds: true

optimizer:
  name: adam
  params:
    lr: 0.001
    weight_decay: 0.0
    betas: 
      - 0.9
      - 0.999

loss:
  name: bcefocal
  params:
    pos_weight: null
    gamma: 0
    alpha: null
    reduction: 'mean'
  