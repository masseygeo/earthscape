experiment:
  output_root: ../models/classification
  # custom_dir: none
  # mode: train
  description: "Smoke test run for training, validation, and inference using F1-optimized model."
  seed: 111

paths:
  patch_dirs: 
    - ../data/warren/patches_warren
    - ../data/howevalley/patches_howevalley
    - ../data/sonora/patches_sonora
  splits:
    train: ../splits/smoke_train.geojson
    val: ../splits/smoke_val.geojson
    test: ../splits/smoke_test.geojson
    cross_test: ../splits/smoke_cross_test.geojson
  areas_csv: ../data/earthscape_areas.csv
  patch_geojson: ../data/earthscape_patches.geojson
  labels_csv: ../data/earthscape_labels.csv
  stats_csv: data/earthscape_image_stats.csv
  # class_mapping: ../data/earthscape_class_mapping.json

data: 
  modalities: 
    dem:
      channels:
        - dem.tif
    aerial:
      channels:
        - aerialr.tif
        - aerialg.tif
        - aerialb.tif
  apply_normalizations: true

model: 
  encoder: resnext
  enable_attention: true
  embedding_dim: 512
  num_heads: 8
  p_attn: 0.0
  p_resid: 0.0

train:
  device: auto
  batch_size: 4
  num_epochs: 5
  shuffle_train: true
  drop_last: true
  num_workers: 8

optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0
  betas: 
    - 0.9
    - 0.999

scheduler:
  name: none        # or "cosine", "step"
  step_size: 10     # used if step
  gamma: 0.1

loss:
  name: focal
  gamma: 2.0
  alpha: 0.25
  reduction: sum
  