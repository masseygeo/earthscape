
experiment:
  root: experiments/baselines/classification/single
  seed: 111
  task: classification


data:
  root: data
  dirs: 
    - warren/patches
    - howevalley/patches
    - sonora/patches
    # - smoke/patches
  input:
    ep:
      channels:
        - ep_51x51.tif
    aerial:
      channels:
        - aerialr.tif
        - aerialg.tif
        - aerialb.tif


splits:
  root: splits/esv1p1_splits
  glob:
    train: "*train_id.geojson"
    val: "*val_id.geojson"
    test: "*test_id.geojson"
    cross: "*test_cd.geojson"


norm:
  root: splits/esv1p1_splits
  glob: "*train_stats.csv"
  normalize: true


dataloader:
  base:
    batch_size: 64
    num_workers: 0
    persistent_workers: false
    prefetch_factor: null
  train:
    augment: true
    shuffle: true
    drop_last: true
  eval:
    augment: false
    shuffle: false
    drop_last: false


model: 
  model_name: resnet18         # model name (resnet18, resnet50, vit, swin) for classification; (unet, deeplabv3p, segformer) for segmentation
  encoder_name: null           # encoder used for segmentation model baselines (see segmentation-models-pytorch docs; default is resnet50)
  image_size: 256
  output_size: 7
  sgmapnet_params:
    input_adapter: adapt                    # adapt, direct
    encoder_sharing: separate               # shared, separate
    embedding_fusion: cross_attention         # none, self_attention, cross_attention, concat
    image_size: null
    pretrained: true
    embedding_dim: 512
    num_heads: 8
    p_attn: 0.0
    p_resid: 0.0


labels:
  root: data
  glob: "*areas.csv"
  area_threshold: 0.0        # labels - None: use area-proportions (need softmax), float: create one-hots of class presence by area proportion


training:
  num_epochs: 2    


optimizer:
  name: AdamW
  params:
    lr: 0.0003
    weight_decay: 0.01
    betas: 
      - 0.9
      - 0.999
  warmup: true
  warmup_params:
    start_factor: 0.001
    end_factor: 1.0
    total_iters: "5 epochs converted to steps"
  cosine_decay: true
  cd_params:
    T_max: "starts at 5 epochs"
    eta_min: 0.00001


loss:
  classification:
    name: bcefocal
    params:
      pos_weight: null
      gamma: 0
      alpha: null
      reduction: "mean"
  segmentation:
    name: crossentropyloss
    params:
      weight: null
      reduction: "mean"
  

early_stop:
  patience: 10
  min_delta: 0.0
  warmup_epochs: 20


eval:
  optimize_clf_thresholds: true